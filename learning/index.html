<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="阅读、交易与学习资料的个人知识工作台。">
    <title>知识工作台</title>
    <link rel="stylesheet" href="/reading-workspace/assets/app.css">
    <link rel="stylesheet" href="/reading-workspace/assets/workspace.css">
    <script>window.HUB_SITE_BASE="/reading-workspace";window.HUB_GITHUB_CONFIG={"owner": "rujiewu", "repository": "rujiewu/ReadingAgent", "module": "learning", "base": "/reading-workspace"};</script><script src="/reading-workspace/assets/modules.js" defer></script>
    <script src="/reading-workspace/assets/study.js" defer></script>
    <script src="/reading-workspace/assets/study-navigation.js" defer></script>
    <script src="/reading-workspace/assets/workspace-state.js" defer></script>
    <script src="/reading-workspace/assets/evidence.js" defer></script>
    <script src="/reading-workspace/assets/book-study.js" defer></script>
    <script src="/reading-workspace/assets/github-transport.js" defer></script>
    <script src="/reading-workspace/assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div id="boot-view" class="boot-view" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在打开工作台…</span>
    </div>

    <main id="login-view" class="login-view" hidden>
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">知</div>
        <p class="eyebrow">PERSONAL KNOWLEDGE HUB</p>
        <h1 id="login-title">回到你的知识工作台</h1>
        <p class="login-copy">阅读、练习与对话都保留在你的私有空间。</p>
        <form id="login-form" class="login-form">
          <label for="password">访问密码</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button id="login-submit" class="primary-button" type="submit">进入</button>
          </div>
          <p id="login-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </main>

    <div id="app-shell" class="app-shell" hidden>
      <header class="site-header">
        <a class="brand" href="/reading-workspace/reading/" aria-label="知识工作台首页">
          <span class="brand-mark small" aria-hidden="true">知</span>
          <span>知识工作台</span>
        </a>
        <nav class="module-nav" aria-label="工作台模块">
          <a href="/reading-workspace/reading/" data-module="reading">阅读</a>
          <a href="/reading-workspace/trading/" data-module="trading">交易</a>
          <a href="/reading-workspace/learning/" data-module="learning">学习</a>
          <a href="/reading-workspace/investment/" data-module="investment">投资</a>
        </nav>
        <div class="header-actions">
          <span>私人空间</span>
          <button id="focus-toggle" type="button" aria-label="进入专注阅读，收起目录和讨论" aria-pressed="false">专注阅读</button>
          <button id="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false">深色</button>
          <button id="logout" type="button" hidden>退出</button>
        </div>
      </header>

      <nav class="pane-switcher" aria-label="工作区视图">
        <button type="button" data-pane="catalog" aria-pressed="false">资料目录</button>
        <button type="button" data-pane="read" aria-pressed="true">阅读与练习</button>
        <button type="button" data-pane="chat" aria-pressed="false">讨论</button>
      </nav>

      <main id="main-content" class="workspace" tabindex="-1">
        <section class="library-panel" aria-labelledby="library-title">
          <div class="module-heading">
            <p id="module-eyebrow" class="eyebrow"></p>
            <h1 id="library-title"></h1>
            <p id="module-description" class="module-description"></p>
          </div>

          <label class="search-box" for="resource-search">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="sr-only">搜索资料</span>
            <input id="resource-search" type="search" placeholder="搜索资料" autocomplete="off">
            <kbd aria-hidden="true">⌘K</kbd>
          </label>
          <div class="group-filter">
            <label for="resource-group" id="group-label">分类</label>
            <select id="resource-group"><option value="">全部分类</option></select>
          </div>
          <div class="list-meta">
            <span id="resource-count">0 项资料</span>
            <span id="catalog-status" role="status" aria-live="polite"></span>
          </div>
          <div id="resource-list" class="resource-list" role="listbox" aria-label="资料列表"></div>
        </section>

        <article id="resource-detail" class="detail-panel" aria-labelledby="detail-title">
          <div id="detail-empty" class="center-state">
            <span class="spinner" aria-hidden="true"></span>
            <p>正在读取资料…</p>
          </div>
          <div id="detail-content" hidden>
            <header class="detail-header">
              <h2 id="detail-title"></h2>
              <div id="detail-placement" class="detail-placement" hidden aria-label="材料在知识主干中的位置"></div>
              <p id="detail-subtitle" class="detail-subtitle"></p>
              <p id="resume-status" class="resume-status" role="status" hidden></p>
            </header>
            <div class="detail-navigation">
              <div class="detail-tabs" role="tablist" aria-label="资料内容">
                <button type="button" role="tab" id="tab-text" data-detail-view="text" aria-controls="text-section" aria-selected="true">学习与延伸</button>
                <button type="button" role="tab" id="tab-practice" data-detail-view="practice" aria-controls="exercise-panel" aria-selected="false" tabindex="-1">练习与笔记</button>
              </div>
              <div id="study-controls" class="study-controls">
                <label for="study-section">正文位置</label>
                <select id="study-section" aria-label="跳到正文位置"></select>
                <span id="study-position" title="正文位置，不代表学习完成度"></span>
              </div>
            </div>
            <section id="text-section" role="tabpanel" aria-labelledby="tab-text" tabindex="0">
              <div id="detail-body" class="detail-body"></div>
              <div id="book-study" hidden></div>
              <section id="links-section" class="links-section" aria-labelledby="links-title">
                <h3 id="links-title" tabindex="-1">延伸与证据</h3>
                <div id="resource-links" class="resource-links"></div>
                <div id="evidence-ledger" class="evidence-ledger"></div>
              </section>
              <button id="study-practice" class="practice-start" type="button">写下理解，做一次练习 →</button>
              <nav id="material-sequence" class="material-sequence" aria-label="同一学习路径的相邻资料" hidden></nav>
            </section>
            <section id="exercise-panel" class="exercise-panel" role="tabpanel" aria-labelledby="tab-practice" tabindex="0" hidden>
              <div class="section-heading">
                <div>
                  <h3 id="exercise-title">想一想，再写下来</h3>
                </div>
                <span class="private-badge">本机保存</span>
              </div>
              <p id="exercise-prompt" class="exercise-prompt"></p>
              <div class="practice-tools">
                <button id="insert-worksheet" class="secondary-button" type="button">加入思考提纲</button>
                <span>追加到回答末尾，不覆盖已有笔记。</span>
              </div>
              <label for="note-answer" class="answer-label">练习回答</label>
              <textarea id="note-answer" rows="7" placeholder="在这里写下你的理解、疑问或推演…"></textarea>
              <div class="note-actions">
                <button id="save-note" class="secondary-button" type="button">保存回答</button>
                <button id="discuss-note" class="secondary-button" type="button">保存并准备讨论</button>
              </div>
              <p id="note-status" role="status" aria-live="polite">回答保存在本机；发送问题时，会连同当前资料用于讨论。</p>
              <p class="practice-disclaimer">只准备问题，不自动发送。发送后，当前资料与已保存回答会交给模型讨论。</p>
              <div id="practice-guide" class="practice-guide"></div>
            </section>
          </div>
        </article>

        <aside class="chat-panel" aria-labelledby="chat-title">
          <header class="chat-header">
            <div>
              <h2 id="chat-title">深入讨论</h2>
            </div>
            <button id="new-session" class="icon-text-button" type="button" title="新建对话">
              <span aria-hidden="true">＋</span><span>新对话</span>
            </button>
          </header>

          <div class="context-strip">
            <span class="context-dot" aria-hidden="true"></span>
            <span>当前上下文</span>
            <strong id="chat-context">尚未选择资料</strong>
          </div>

          <details id="history-drawer" class="history-drawer">
            <summary>
              <span>历史对话</span>
              <span id="session-count" class="count-badge">0</span>
            </summary>
            <div id="session-list" class="session-list"></div>
          </details>

          <div id="chat-messages" class="chat-messages" aria-live="polite" aria-label="对话消息">
            <div id="chat-welcome" class="chat-welcome">
              <p>选正文中的一个问题深入讨论，也可以直接说出你卡住的地方。</p>
            </div>
          </div>

          <form id="chat-form" class="chat-form">
            <label class="sr-only" for="chat-input">输入消息</label>
            <textarea id="chat-input" rows="2" placeholder="围绕当前资料提问…" required></textarea>
            <div class="composer-footer">
              <span id="chat-status" role="status" aria-live="polite"></span>
              <button id="chat-send" class="send-button" type="submit">
                <span>发送</span><span aria-hidden="true">↑</span>
              </button>
            </div>
          </form>
          <p id="model-meta" class="model-meta"></p>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
